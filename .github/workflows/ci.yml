name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || {
            echo "Run gofmt on these files:"
            echo "$unformatted"
            exit 1
          }

      - name: Run static checks
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Build API
        run: go build ./cmd/api

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build API container
        run: docker build --tag orderflow-api:ci .
